<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🏝️ 小島放假行事曆</title>
<style>
:root{--bg:#f6f1dc;--card:#fffdf2;--g:#7bc47f;--gd:#4f9a5a;--t:#5a4a3a;--r:#e8756b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:"Nunito","PingFang TC","Microsoft JhengHei",sans-serif}
.w{max-width:1100px;margin:auto;padding:16px}
h1{text-align:center;margin:8px 0 14px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:16px;box-shadow:0 4px 0 #e3dab4}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input{padding:10px 14px;border:2px solid #d9cfa5;border-radius:14px;font-size:16px;background:#fff;min-width:0;flex:1}
button{background:var(--g);color:#fff;border:0;border-radius:14px;padding:10px 18px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--gd)}
button.s{background:#fff;color:var(--t);box-shadow:0 3px 0 #d9cfa5;padding:6px 14px}
.av{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin-top:12px}
.av div{text-align:center;font-size:12px;padding:6px 2px;border:3px solid transparent;border-radius:16px;cursor:pointer}
.av div.on{border-color:var(--g);background:#e8f6e4}
.av svg{width:56px;height:73px;display:block;margin:auto}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.p{display:flex;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:10px}
.p svg{width:48px;height:48px;flex:none}.p b{display:block}.p small{color:#8a7a68}
.big{font-size:22px;color:var(--r);font-weight:800}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.h{text-align:center;font-weight:700;font-size:13px;padding:4px}
.c{min-height:74px;background:#fff;border-radius:12px;padding:4px;font-size:13px;cursor:pointer;position:relative;overflow:hidden}
.c.we{background:#fdeee9}.c.ho{background:#ffe3df}.c.me{background:#d9f2d4;outline:3px solid var(--g)}.c.td{box-shadow:inset 0 0 0 3px #f3b94c}.c.x{opacity:.35;cursor:default}
.c i{display:block;font-style:normal;color:var(--r);font-size:11px}
.dots{display:flex;flex-wrap:wrap;gap:1px;margin-top:2px}.dots svg{width:18px;height:18px}
@media(max-width:560px){.c{min-height:58px;font-size:12px}.dots svg{width:14px;height:14px}}
.vil{background:linear-gradient(#bfe6ff 0,#e9f7ff 84px,#92d98c 84px,#6fc276 100%);border-radius:20px;padding:46px 16px 26px;position:relative;overflow:hidden}
.vil .cl{position:absolute;top:4px;font-size:32px;animation:fl 50s linear infinite}@keyframes fl{from{left:-12%}to{left:108%}}
.vil .dc{position:absolute;font-size:30px}
.vg{display:flex;flex-wrap:wrap;justify-content:center;gap:34px 20px;position:relative}
.lot{width:150px;text-align:center}
.house{width:92px;margin:0 auto}.roof{height:34px;background:var(--c);clip-path:polygon(50% 0,100% 100%,0 100%)}
.wall{background:#fff4d6;height:46px;border-radius:0 0 6px 6px;position:relative;box-shadow:0 3px 0 #0002}
.door{position:absolute;bottom:0;left:14px;width:18px;height:28px;background:#a9714b;border-radius:9px 9px 0 0}
.win{position:absolute;top:8px;right:8px;width:34px;height:30px;background:#9fd8ff;border:3px solid #fff;border-radius:6px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.lot.sleep .win{background:#2f3b6a}.bed svg{width:30px;height:30px;transform:rotate(-14deg) translateY(6px);display:block}
.z{position:absolute;top:-16px;right:-2px;font-size:15px;animation:zz 2s ease-in-out infinite}@keyframes zz{50%{transform:translateY(-6px);opacity:.5}}
.yard{height:84px;display:flex;justify-content:center;align-items:flex-end;position:relative;gap:4px}
.pp{width:54px;position:relative}.pp svg{width:54px;height:70px;display:block}
.bob{animation:bob 1.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px)}}
.sgb{background:#e9c98e;border:2px solid #a9714b;border-radius:7px;padding:3px 5px;font-size:12px;font-weight:800;max-width:86px;white-space:pre-line;line-height:1.2;align-self:flex-start;margin-top:4px;animation:wg 1.2s ease-in-out infinite;transform-origin:bottom left}@keyframes wg{50%{transform:rotate(5deg)}}
.bag{position:absolute;right:-34px;bottom:22px;width:42px;min-height:34px;background:#e8756b;color:#fff;border:2px solid #b5493f;border-radius:10px 10px 8px 8px;font-size:11px;font-weight:800;line-height:1.1;padding:3px 2px;display:flex;align-items:center;justify-content:center;word-break:break-all}
.walk{animation:bob .8s ease-in-out infinite}
.nm{font-weight:800;font-size:13px;background:#fffc;border-radius:10px;padding:1px 8px;display:inline-block}.nm small{display:block;font-weight:600;font-size:11px;color:#8a7a68}
@media(max-width:560px){.lot{width:44%}.vg{gap:26px 6px}.vil{padding:40px 8px 20px}}
.c.bz{background:#d6e9fb;outline:3px solid #6aa7e0}.dots .b svg{outline:2px solid #6aa7e0;border-radius:50%}.bag.bz{background:#4a90d9;border-color:#2f6fb0}.sgb.bz{background:#cfe4f7;border-color:#4a90d9;color:#1f4f85}.bag{white-space:pre-line}.p .big{font-size:18px}
select{padding:10px;border:2px solid #d9cfa5;border-radius:14px;font-size:15px;background:#fff}
.c.sel{box-shadow:0 0 0 3px #4a90d9}
</style></head><body><div class="w">
<h1>🏝️ 小島放假行事曆</h1>
<div id="mode" style="text-align:center;font-size:13px;margin:-8px 0 12px;color:#8a7a68"></div>
<div class="card" id="me"></div>
<div class="card" style="padding:10px"><b>🏘️ 今天的小島村莊</b><div class="vil" id="vil" style="margin-top:8px"></div></div>
<div class="card" id="ban" style="text-align:center;font-size:18px"></div>
<div class="card"><b>🎉 大家的放假倒數</b><div class="board" id="board" style="margin-top:10px"></div></div>
<div class="card"><div class="nav"><button class="s" id="pv">◀</button><b id="ttl"></b><button class="s" id="nx">▶</button></div>
<div class="g" id="cal"></div>
<div id="bar" style="margin-top:10px"></div><small style="display:block;margin-top:8px">點日期選取 → 按「設為休假」；也可填那天要去哪，村莊裡的背包會寫上。綠色＝我的休假，藍色＝出差，粉色＝週末，紅色＝國定假日。</small></div>
</div>
<script>
// ===== 設定 =====
const API_URL = ""; // 貼上 Google Apps Script 網頁應用程式網址；留空＝本機試玩模式
const HOL = {   // 國定假日（週末不用填，系統自動算）
  "2026-01-01":"開國紀念日",
  "2026-02-16":"除夕","2026-02-17":"春節初一","2026-02-18":"春節初二","2026-02-19":"春節初三","2026-02-20":"小年夜補假",
  "2026-02-27":"和平紀念日補假","2026-04-03":"兒童節補假","2026-04-06":"清明節補假","2026-05-01":"勞動節",
  "2026-06-19":"端午節","2026-09-25":"中秋節","2026-09-28":"教師節","2026-10-09":"國慶日補假","2026-10-26":"光復節補假","2026-12-25":"行憲紀念日",
  "2027-01-01":"開國紀念日",
  "2027-02-04":"小年夜","2027-02-05":"除夕","2027-02-08":"春節初三","2027-02-09":"春節補假","2027-02-10":"春節補假",
  "2027-03-01":"和平紀念日補假","2027-04-05":"清明節","2027-04-06":"兒童節補假","2027-04-30":"勞動節補假",
  "2027-10-11":"國慶日補假","2027-10-25":"光復節","2027-12-24":"行憲紀念日補假","2027-12-31":"開國紀念日補假"
  // TODO 待人事總處公告確認後補：2027 端午節、中秋節、孔子誕辰
};
// ===== 角色（原創動森風、立體光影，非真人肖像）=====
const DEFS=`<defs><radialGradient id="hl" cx=".35" cy=".3" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><radialGradient id="sh" cx=".4" cy=".35" r=".8"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#6b2e12" stop-opacity=".38"/></radialGradient><radialGradient id="bg" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><clipPath id="k"><circle cx="50" cy="50" r="50"/></clipPath></defs>`;
const S=x=>`<svg viewBox="0 0 100 100">${DEFS}${x}</svg>`;
const ov=(t,a,c)=>`<${t} ${a} fill="${c}"/><${t} ${a} fill="url(#sh)"/><${t} ${a} fill="url(#hl)"/>`;
const BG=c=>`<circle cx="50" cy="50" r="50" fill="${c}"/><circle cx="50" cy="50" r="50" fill="url(#bg)"/>`;
const EY=(x,y)=>`<ellipse cx="${x}" cy="${y}" rx="3.6" ry="4.3" fill="#2d2420"/><circle cx="${x+1.3}" cy="${y-1.6}" r="1.4" fill="#fff"/><circle cx="${x-1.2}" cy="${y+1.6}" r=".7" fill="#fff" opacity=".7"/>`;
const F=x=>`<svg viewBox="0 0 100 130">${DEFS}${x}</svg>`;
const SH=`<ellipse cx="50" cy="124" rx="28" ry="5" fill="#000" opacity=".16"/>`;
const hp=(skin,hair,st,smile)=>{
 const back=st=='long'?ov('rect','x="22" y="34" width="56" height="52" rx="22"',hair):st=='bob'?ov('rect','x="23" y="34" width="54" height="38" rx="17"',hair):st=='bun'?ov('circle','cx="50" cy="13" r="10"',hair):st=='pony'?ov('path','d="M62 24Q96 22 91 62Q89 84 75 90Q85 62 70 44Z"',hair):'';
 const fr={long:"M23 50Q20 20 50 20Q80 20 77 50Q68 34 50 36Q32 34 23 50Z",bob:"M23 50Q20 20 50 20Q80 20 77 50Q68 34 50 36Q32 34 23 50Z",pony:"M24 48Q22 22 50 21Q78 22 76 48Q62 36 50 36Q38 36 24 48Z",bun:"M24 48Q22 22 50 21Q78 22 76 48Q62 36 50 36Q38 36 24 48Z",side:"M23 52Q18 20 52 19Q82 20 77 48Q60 40 40 30Q34 42 23 52Z",buzz:"M24 46Q22 22 50 21Q78 22 76 46Q60 32 50 33Q40 32 24 46Z",curl:"M23 50Q20 20 50 20Q80 20 77 50Q66 36 50 38Q34 36 23 50Z"}[st];
 const curl=st=='curl'?[30,42,54,66].map(x=>ov('circle',`cx="${x}" cy="24" r="9"`,hair)).join(''):'';
 const eyes=smile?`<path d="M35 54Q40 49 45 54M55 54Q60 49 65 54" stroke="#2d2420" stroke-width="3" fill="none" stroke-linecap="round"/>`:EY(40,54)+EY(60,54);
 return {back,front:`<circle cx="23.5" cy="55" r="5" fill="${skin}"/><circle cx="76.5" cy="55" r="5" fill="${skin}"/>${ov('ellipse','cx="50" cy="52" rx="27" ry="26"',skin)}${curl}${ov('path',`d="${fr}"`,hair)}${st=='pony'?'<circle cx="68" cy="28" r="4.6" fill="#e8756b"/><circle cx="67" cy="26.8" r="1.4" fill="#fff" opacity=".6"/>':''}<path d="M34 27Q46 21 60 25" stroke="#fff" stroke-opacity=".5" stroke-width="3" fill="none" stroke-linecap="round"/>${eyes}<ellipse cx="50" cy="59.5" rx="1.8" ry="1.2" fill="#000" opacity=".13"/><ellipse cx="32" cy="63" rx="5.5" ry="3.2" fill="#ff8f88" opacity=".55"/><ellipse cx="68" cy="63" rx="5.5" ry="3.2" fill="#ff8f88" opacity=".55"/><path d="M43 64Q50 71 57 64" stroke="#a5483f" stroke-width="2.5" fill="none" stroke-linecap="round"/>`}};
const H=(skin,hair,st,bg,shirt,smile)=>{const q=hp(skin,hair,st,smile);return S(`${BG(bg)}<g clip-path="url(#k)">${q.back}${ov('ellipse','cx="50" cy="100" rx="40" ry="26"',shirt)}<path d="M40 78Q50 90 60 78" stroke="#fff" stroke-opacity=".5" stroke-width="3" fill="none"/><rect x="42" y="68" width="16" height="14" rx="6" fill="${skin}"/><ellipse cx="50" cy="73" rx="12" ry="4" fill="#000" opacity=".14"/>${q.front}</g>`)};
const HF=(skin,hair,st,bg,shirt,smile)=>{const q=hp(skin,hair,st,smile),T='transform="translate(50 45) scale(1.18) translate(-50 -52)"',L=c=>ov('rect',`x="${c}" y="100" width="11" height="20" rx="5"`,"#5c6f99");
 return F(`${SH}${L(36)}${L(53)}<ellipse cx="41" cy="121" rx="8" ry="4.5" fill="#8a5a3a"/><ellipse cx="59" cy="121" rx="8" ry="4.5" fill="#8a5a3a"/><g ${T}>${q.back}</g>${ov('rect','x="30" y="74" width="40" height="34" rx="16"',shirt)}${ov('ellipse','cx="26" cy="90" rx="6" ry="12"',shirt)}${ov('ellipse','cx="74" cy="90" rx="6" ry="12"',shirt)}<circle cx="25" cy="101" r="4.8" fill="${skin}"/><circle cx="75" cy="101" r="4.8" fill="${skin}"/><rect x="43" y="70" width="14" height="10" rx="5" fill="${skin}"/><g ${T}>${q.front}</g>`)};
const mk=(id,n,...a)=>({id,n,s:H(...a),f:HF(...a)});
// 自訂圖片角色：img("代號","名稱","圖片網址或路徑")，圖片建議透明背景 PNG、直立全身
const img=(id,n,u)=>({id,n,s:S(`${BG("#eef6ff")}<g clip-path="url(#k)"><image href="${u}" x="5" y="5" width="90" height="90" preserveAspectRatio="xMidYMin meet"/></g>`),f:F(`${SH}<image href="${u}" x="0" y="0" width="100" height="124" preserveAspectRatio="xMidYMax meet"/>`)});
const CAT=`<path d="M20 42L22 10L46 28Z" fill="#f0b55a"/><path d="M80 42L78 10L54 28Z" fill="#f0b55a"/><path d="M26 34L27 18L38 28Z" fill="#f6a5a5"/><path d="M74 34L73 18L62 28Z" fill="#f6a5a5"/>${ov('ellipse','cx="50" cy="56" rx="33" ry="29"',"#f4c26b")}<path d="M50 30V38M43 31L44.5 37M57 31L55.5 37" stroke="#d99a3d" stroke-width="3" fill="none" stroke-linecap="round"/>${ov('ellipse','cx="50" cy="68" rx="17" ry="13"',"#fff")}${EY(38,55)}${EY(62,55)}<path d="M47 62L53 62L50 66Z" fill="#f08a8a"/><path d="M50 66Q46 72 42 69M50 66Q54 72 58 69" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/><ellipse cx="30" cy="64" rx="5" ry="3" fill="#ff8f88" opacity=".5"/><ellipse cx="70" cy="64" rx="5" ry="3" fill="#ff8f88" opacity=".5"/>`;
const DOG=`${ov('ellipse','cx="22" cy="46" rx="11" ry="22"',"#9b6b43")}${ov('ellipse','cx="78" cy="46" rx="11" ry="22"',"#9b6b43")}${ov('ellipse','cx="50" cy="54" rx="29" ry="28"',"#e3b987")}${ov('ellipse','cx="50" cy="68" rx="16" ry="12"',"#fff")}${EY(38,50)}${EY(62,50)}<ellipse cx="50" cy="62" rx="6.5" ry="4.8" fill="#2d2420"/><ellipse cx="48" cy="60.5" rx="2" ry="1.2" fill="#fff" opacity=".7"/><path d="M50 66V71M50 71Q45 76 41 72M50 71Q55 76 59 72" stroke="#2d2420" stroke-width="2" fill="none" stroke-linecap="round"/><ellipse cx="30" cy="62" rx="5" ry="3" fill="#ff8f88" opacity=".5"/><ellipse cx="70" cy="62" rx="5" ry="3" fill="#ff8f88" opacity=".5"/>`;
const PT=`transform="translate(50 46) scale(.92) translate(-50 -52)"`;
// 原創小外星人：雙觸角＋肚子星星徽章
const ALH=c=>`<path d="M40 30Q36 16 30 11M60 30Q64 16 70 11" stroke="${c}" stroke-width="3.5" fill="none" stroke-linecap="round"/><circle cx="30" cy="9.5" r="5.5" fill="#ffd95a"/><circle cx="70" cy="9.5" r="5.5" fill="#ffd95a"/><circle cx="28.5" cy="8" r="1.8" fill="#fff" opacity=".8"/><circle cx="68.5" cy="8" r="1.8" fill="#fff" opacity=".8"/>${ov('ellipse','cx="50" cy="52" rx="30" ry="27"',c)}${EY(39,52)}${EY(61,52)}<ellipse cx="31" cy="62" rx="5" ry="3" fill="#ff8f88" opacity=".55"/><ellipse cx="69" cy="62" rx="5" ry="3" fill="#ff8f88" opacity=".55"/><path d="M44 62Q50 68 56 62" stroke="#3a3a4a" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
const al=(id,n,c,d,bg)=>({id,n,s:S(`${BG(bg)}<g clip-path="url(#k)">${ov('ellipse','cx="50" cy="100" rx="32" ry="24"',c)}${ALH(c)}</g>`),f:F(`${SH}${ov('ellipse','cx="40" cy="121" rx="9" ry="5"',d)}${ov('ellipse','cx="60" cy="121" rx="9" ry="5"',d)}${ov('ellipse','cx="50" cy="97" rx="25" ry="25"',c)}<path d="M50 89L52.4 95.2L59 95.4L53.8 99.4L55.6 105.8L50 102L44.4 105.8L46.2 99.4L41 95.4L47.6 95.2Z" fill="#fff" opacity=".85"/>${ov('ellipse','cx="26" cy="94" rx="5.5" ry="9"',c)}${ov('ellipse','cx="74" cy="94" rx="5.5" ry="9"',c)}<g transform="translate(50 48) scale(.9) translate(-50 -52)">${ALH(c)}</g>`)});
// 原創噴火小龍：圓角小龍＋紫色小翅膀＋嘴邊噴小火花
const DRH=`${ov('path','d="M30 34Q22 14 14 12Q20 28 24 40Z"',"#ffe2a8")}${ov('path','d="M70 34Q78 14 86 12Q80 28 76 40Z"',"#ffe2a8")}${ov('ellipse','cx="50" cy="54" rx="31" ry="27"',"#e8605a")}${ov('ellipse','cx="50" cy="66" rx="14" ry="10"',"#ffe2a8")}<ellipse cx="45" cy="65" rx="1.6" ry="1.2" fill="#a5483f"/><ellipse cx="55" cy="65" rx="1.6" ry="1.2" fill="#a5483f"/>${EY(37,50)}${EY(63,50)}<ellipse cx="29" cy="60" rx="5" ry="3" fill="#ff9b94" opacity=".6"/><ellipse cx="71" cy="60" rx="5" ry="3" fill="#ff9b94" opacity=".6"/><path d="M44 71Q50 76 56 71" stroke="#a5483f" stroke-width="2.3" fill="none" stroke-linecap="round"/><path d="M62 70Q73 63 72 54Q80 62 84 70Q78 78 64 75Z" fill="#ffb020"/><path d="M66 70Q73 66 73 60Q77 65 78 70Q75 74 68 73Z" fill="#ffe066"/>`;
const DRG={id:"dr1",n:"噴火小龍",s:S(`${BG("#ffe9d6")}<g clip-path="url(#k)">${ov('ellipse','cx="50" cy="100" rx="32" ry="24"',"#e8605a")}${DRH}</g>`),f:F(`${SH}<path d="M26 84Q4 70 6 98Q16 90 20 99Q22 91 30 95Z" fill="#9b7ed8"/><path d="M74 84Q96 70 94 98Q84 90 80 99Q78 91 70 95Z" fill="#9b7ed8"/><path d="M72 112Q96 112 92 96" stroke="#e8605a" stroke-width="9" fill="none" stroke-linecap="round"/>${ov('ellipse','cx="50" cy="97" rx="25" ry="25"',"#e8605a")}${ov('ellipse','cx="50" cy="102" rx="15" ry="17"',"#ffe2a8")}${ov('ellipse','cx="26" cy="94" rx="5.5" ry="9"',"#e8605a")}${ov('ellipse','cx="74" cy="94" rx="5.5" ry="9"',"#e8605a")}${ov('ellipse','cx="40" cy="121" rx="9" ry="5"',"#ffe2a8")}${ov('ellipse','cx="60" cy="121" rx="9" ry="5"',"#ffe2a8")}<g transform="translate(50 48) scale(.9) translate(-50 -52)">${DRH}</g>`)};
const AV=[
{id:"cat",n:"黃白貓咪",s:S(`${BG("#fde9c4")}<g clip-path="url(#k)">${ov('ellipse','cx="50" cy="100" rx="30" ry="22"',"#fff6e6")}${CAT}</g>`),f:F(`${SH}<path d="M70 108Q96 106 90 76" stroke="#f0b55a" stroke-width="9" fill="none" stroke-linecap="round"/>${ov('ellipse','cx="50" cy="98" rx="26" ry="24"',"#f4c26b")}${ov('ellipse','cx="50" cy="102" rx="15" ry="16"',"#fff")}${ov('ellipse','cx="37" cy="120" rx="9" ry="5"',"#fff")}${ov('ellipse','cx="63" cy="120" rx="9" ry="5"',"#fff")}<g ${PT}>${CAT}</g>`)},
{id:"dog",n:"柔軟狗狗",s:S(`${BG("#d9ecf7")}<g clip-path="url(#k)">${ov('ellipse','cx="50" cy="100" rx="30" ry="22"',"#fff6e6")}${DOG}</g>`),f:F(`${SH}<path d="M72 108Q94 104 88 84" stroke="#9b6b43" stroke-width="8" fill="none" stroke-linecap="round"/>${ov('ellipse','cx="50" cy="98" rx="26" ry="24"',"#e3b987")}${ov('ellipse','cx="50" cy="102" rx="15" ry="16"',"#fff")}${ov('ellipse','cx="37" cy="120" rx="9" ry="5"',"#fff")}${ov('ellipse','cx="63" cy="120" rx="9" ry="5"',"#fff")}<g ${PT}>${DOG}</g>`)},
mk("g1","長髮女孩","#ffe0c8","#6b4130","long","#ffe3ea","#f7a6b8"),

const avOf=id=>(AV.find(a=>a.id==id)||AV[0]).s,fOf=id=>(AV.find(a=>a.id==id)||AV[0]).f;
// ===== 狀態與資料 =====
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ds=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

 const i=people.findIndex(p=>p.id==my.id);i<0?people.push(my):people[i]=my;

const isOff=(p,d)=>{const w=d.getDay(),k=ds(d);return w==0||w==6?"週末":HOL[k]?HOL[k]:(p.leaves||[]).includes(k)?"休假":null};
const fmtLeft=ms=>{const m=Math.floor(ms/6e4),d=Math.floor(m/1440),h=Math.floor(m%1440/60);return d>0?d+" 天 "+h+" 小時":h>0?h+" 小時 "+(m%60)+" 分":(m%60)+" 分鐘"};
// 下班時間 18:00：假期前一天 18:00 起就算放假
const offAt=(p,d)=>{const e=((p&&p.early)||{})[ds(d)]||"18:00",[h,m]=e.split(":"),x=new Date(d);x.setHours(+h,+m,0,0);return x};
function next(p){const now=new Date(),t=new Date(now);t.setHours(0,0,0,0);for(let i=0;i<400;i++){const d=new Date(t);d.setDate(t.getDate()+i);const r=isOff(p,d);if(r){let n=1;for(;n<60;n++){const e=new Date(d);e.setDate(d.getDate()+n);if(!isOff(p,e))break}
 let st=now;if(i>0){const pv=new Date(d);pv.setDate(d.getDate()-1);st=offAt(p,pv)}return{i,r,n,d,ms:st-now}}}return{i:999,n:0,ms:1e15}}
function nextLong(p){const now=new Date(),t=new Date(now);t.setHours(0,0,0,0);const D=i=>{const d=new Date(t);d.setDate(t.getDate()+i);return d},pub=d=>d.getDay()%6==0||HOL[ds(d)];
 for(let i=0;i<400;){if(!pub(D(i))){i++;continue}let j=i;while(j<i+30&&pub(D(j)))j++;
  if(j-i>=3){let nm="週末";for(let q=i;q<j;q++){const h=HOL[ds(D(q))];if(h){nm=h;break}}let st=now;if(i>0)st=offAt(p,D(i-1));return{i,L:j-i,d:D(i),nm,ms:st-now}}i=j}return null}
// ===== 村莊 =====
function village(L){
 const now=new Date(),t=new Date(now);t.setHours(0,0,0,0);const tm=new Date(t);tm.setDate(t.getDate()+1);const T=ds(t),M=ds(tm),cols=["#e8756b","#6aa7e0","#f2b84b","#7fc48a","#b08be0","#f4a261"];
 const nextPlan=p=>{const lv=p.leaves||[],bz=p.biz||[],dd=p.dest||{},f=x=>(x.getMonth()+1)+"/"+x.getDate();
  for(let i=2;i<=30;i++){const d=new Date(t);d.setDate(t.getDate()+i);const k=ds(d),b=bz.includes(k);
   if(b||lv.includes(k)||dd[k]){const arr=b?bz:lv;let e=d;for(;;){const n=new Date(e);n.setDate(e.getDate()+1);if(arr.includes(ds(n)))e=n;else break}
    return{r:f(d)+(e>d?"–"+f(e):""),w:b?"出差"+(dd[k]?" "+dd[k]:""):dd[k]?"去"+dd[k]:"休假",i,b}}}return null};
 const lot=(p,i)=>{const dd=p.dest||{},bz=p.biz||[],oT=isOff(p,t),oM=isOff(p,tm),late=now>=offAt(p,t),eve=!oT&&late&&!!oM;let st="work",txt="",lb="上班中",bk="",y;
  if(bz.includes(T)){st="out";bk="bz";txt="出差"+(dd[T]?"\n"+dd[T]:"");lb="出差中"}
  else if(oT&&dd[T]){st="out";txt="去"+dd[T];lb="外出中"}
  else if(oT||eve){st="sleep";lb=eve?"下班放假 💤":"在家睡覺 💤"}
  else if(bz.includes(M)){st="sign";bk="bz";txt="明天出差"+(dd[M]?"\n"+dd[M]:"");lb="明天出差"}
  else if((oM&&oM!="週末")||dd[M]){st="sign";txt=dd[M]?"明天去"+dd[M]:oM=="休假"?"明天休假":"明天"+oM;lb="明天放假！"}
  else{const n=nextPlan(p);if(n){st="sign";bk=n.b?"bz":"";txt=n.r+"\n"+n.w+"\n還有"+n.i+"天";lb="預計 "+n.r+" "+n.w}else if(oM){st="sign";txt="明天週末";lb="明天放假！"}}
  if(st=="work"&&late)lb=(p.early&&p.early[T])?"提早下班 👋":"下班囉 👋";
  const A=avOf(p.avatar),FB=fOf(p.avatar);
  y=st=="sleep"?"":st=="out"?`<div class="pp walk">${FB}<div class="bag ${bk}">${esc(txt)}</div></div>`:st=="sign"?`<div class="pp bob">${FB}</div><div class="sgb ${bk}">${esc(txt)}</div>`:`<div class="pp bob">${FB}</div>`;
  return `<div class="lot ${st}"><div class="house" style="--c:${cols[i%6]}"><div class="roof"></div><div class="wall"><div class="door"></div><div class="win">${st=="sleep"?`<div class="bed">${A}</div>`:""}</div>${st=="sleep"?'<b class="z">💤</b>':""}</div></div><div class="yard">${y}</div><span class="nm">${esc(p.name)}<small>${lb}</small></span></div>`};
 $("#vil").innerHTML=`<span class="cl">☁️</span><span class="cl" style="top:14px;animation-delay:-25s;font-size:24px">☁️</span><span class="dc" style="left:1%;top:34%">🌳</span><span class="dc" style="right:1%;top:40%">🌲</span><div class="vg">${L.length?L.map(lot).join(""):"<small>村莊還沒有居民～先在上方設定名字與角色吧！</small>"}</div>`}

function render(){
 $("#mode").textContent=modeTxt;
 $("#me").innerHTML=(my?`<div class="row"><div style="width:64px">${avOf(my.avatar)}</div><b>${esc(my.name)}</b><button class="s" id="ed">換角色／改名</button></div>`:`<b>👋 歡迎登島！先取個名字、選個角色</b>`)+
 `<div id="setup" style="${my?'display:none':''}"><div class="row" style="margin-top:10px"><input id="nm" maxlength="12" placeholder="你的名字" value="${my?esc(my.name):''}"><button id="ok">確定</button></div><div class="av">${AV.map(a=>`<div data-a="${a.id}" class="${a.id==pick?'on':''}">${a.f}${a.n}</div>`).join("")}</div></div>`;

 {const now=new Date(),w=now.getDay(),f=x=>(x.getMonth()+1)+"/"+x.getDate();let wk;

  else{const fr=new Date(now);fr.setDate(now.getDate()+5-w);const ms=offAt(my,fr)-now;wk=ms<=0?'<span class="big">下班囉，週末快樂！🎉</span>':'🏖️ 距離週末還有 <span class="big">'+fmtLeft(ms)+'</span>'}

 const y=cur.getFullYear(),m=cur.getMonth();$("#ttl").textContent=`${y} 年 ${m+1} 月`;
 let h="日一二三四五六".split("").map(d=>`<div class="h">${d}</div>`).join("");

 const td=ds(new Date());
 for(let d=1,n=new Date(y,m+1,0).getDate();d<=n;d++){const dt=new Date(y,m,d),k=ds(dt),w=dt.getDay(),mine=my&&(my.leaves||[]).includes(k),bz=my&&(my.biz||[]).includes(k);
  const who=people.filter(p=>!(my&&p.id==my.id)).map(p=>{const l=(p.leaves||[]).includes(k),b=(p.biz||[]).includes(k);return l||b?`<span class="${b?'b':''}" title="${esc(p.name)}${b?'（出差）':''}">${avOf(p.avatar)}</span>`:""}).join("");
  h+=`<div class="c ${w%6==0?'we':''} ${HOL[k]?'ho':''} ${mine?'me':''} ${bz?'bz':''} ${k==td?'td':''} ${k==sel?'sel':''}" data-k="${k}"><b>${d}</b>${HOL[k]?`<i>${HOL[k]}</i>`:""}${mine||bz?`<i style="color:${bz?'#2f6fb0':'#4f9a5a'}">${bz?'出差':''}${my.dest&&my.dest[k]?'→'+esc(my.dest[k]):''}</i>`:""}${my&&my.early&&my.early[k]?`<i style="color:#b5651d">${my.early[k]} 下班</i>`:""}<div class="dots">${mine||bz?`<span class="${bz?'b':''}">${avOf(my.avatar)}</span>`:""}${who}</div></div>`}
 $("#cal").innerHTML=h;
 document.querySelectorAll(".c").forEach(e=>e.onclick=()=>{if(!my)return alert("請先在上方設定名字與角色");sel=e.dataset.k;render()});
 const bar=$("#bar");if(sel&&my){const lv=(my.leaves||[]).includes(sel),bz=(my.biz||[]).includes(sel),dd=(my.dest||{})[sel]||"",d=new Date(sel+"T00:00:00");
  bar.innerHTML=`<div class="row"><b>${sel.slice(5)}（週${"日一二三四五六"[d.getDay()]}）</b><button id="tg" class="${lv?'s':''}">${lv?'取消休假':'設為休假'}</button><button id="tb" class="${bz?'s':''}" style="${bz?'':'background:#6aa7e0;box-shadow:0 3px 0 #3f7fba'}">${bz?'取消出差':'設為出差'}</button><select id="er">${["","17:30","17:00","16:30","16:00","15:00","14:00","13:00","12:00"].map(v=>`<option value="${v}" ${(my.early||{})[sel]==v?'selected':''}>${v?v+' 下班':'正常下班'}</option>`).join("")}</select><input id="ds" maxlength="8" placeholder="這天要去哪？（選填，例如：日本、台中）" value="${esc(dd)}"><button id="sv" class="s">儲存地點</button></div>`;
  const tog=(a,k)=>{const i=a.indexOf(k);i<0?a.push(k):a.splice(i,1);return i<0},cl=()=>{if(my.dest&&!my.leaves.includes(sel)&&!my.biz.includes(sel))delete my.dest[sel]},rm=(a,k)=>{const j=a.indexOf(k);if(j>=0)a.splice(j,1)};
  $("#tg").onclick=()=>{my.leaves=my.leaves||[];my.biz=my.biz||[];if(tog(my.leaves,sel))rm(my.biz,sel);cl();save();render()};
